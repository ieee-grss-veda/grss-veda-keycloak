---
# Production environment overrides for master realm
# Password-only authentication (no SAML)
enabled: true
realm: master

# Use default browser flow (username/password only)
browserFlow: browser

# Explicitly remove any identity providers (e.g., GitHub from dev)
identityProviders: []
identityProviderMappers: []

# Remove custom auth flows (keeps only built-in flows)
authenticationFlows: []
authenticatorConfig: []

# Local admin user for password login
users:
  - username: $(env:MASTER_ADMIN_USERNAME:-admin)
    firstName: Admin
    lastName: User
    email: $(env:MASTER_ADMIN_EMAIL)
    emailVerified: true
    enabled: true
    credentials:
      - type: password
        value: $(env:MASTER_ADMIN_PASSWORD)
        temporary: false
    realmRoles:
      - admin
