---
# Staging environment overrides for master realm
# This file is applied AFTER master.yaml to add SAML IDP and password authentication
enabled: true
realm: master

# Override browser flow to support SAML + Password
browserFlow: Browser with SAML and Password

identityProviders:
  # SAML IDP for staging
  - alias: saml-sso
    displayName: $(env:SAML_IDP_DISPLAY_NAME:-Enterprise SSO)
    providerId: saml
    enabled: true
    updateProfileFirstLoginMode: on
    trustEmail: true
    storeToken: false
    addReadTokenRoleOnCreate: false
    authenticateByDefault: false
    linkOnly: false
    firstBrokerLoginFlowAlias: first broker login
    config:
      entityId: $(env:SAML_ENTITY_ID)
      singleSignOnServiceUrl: $(env:SAML_SSO_URL)
      singleLogoutServiceUrl: $(env:SAML_SLO_URL:-"")
      signingCertificate: $(env:SAML_SIGNING_CERTIFICATE)
      nameIDPolicyFormat: $(env:SAML_NAMEID_FORMAT:-urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress)
      principalType: SUBJECT
      postBindingAuthnRequest: "true"
      postBindingResponse: "true"
      postBindingLogout: "true"
      wantAssertionsSigned: "true"
      wantAssertionsEncrypted: "false"
      validateSignature: "true"
      signatureAlgorithm: RSA_SHA256
      syncMode: FORCE

identityProviderMappers:
  # Map SAML email attribute to Keycloak user
  - name: saml-email-mapper
    identityProviderAlias: saml-sso
    identityProviderMapper: saml-user-attribute-idp-mapper
    config:
      syncMode: FORCE
      user.attribute: email
      attribute.name: $(env:SAML_EMAIL_ATTRIBUTE:-email)

  # Map SAML first name attribute
  - name: saml-firstname-mapper
    identityProviderAlias: saml-sso
    identityProviderMapper: saml-user-attribute-idp-mapper
    config:
      syncMode: FORCE
      user.attribute: firstName
      attribute.name: $(env:SAML_FIRSTNAME_ATTRIBUTE:-firstName)

  # Map SAML last name attribute
  - name: saml-lastname-mapper
    identityProviderAlias: saml-sso
    identityProviderMapper: saml-user-attribute-idp-mapper
    config:
      syncMode: FORCE
      user.attribute: lastName
      attribute.name: $(env:SAML_LASTNAME_ATTRIBUTE:-lastName)

  # Auto-assign admin role to SAML users
  - name: saml-admin-role
    identityProviderAlias: saml-sso
    identityProviderMapper: oidc-hardcoded-role-idp-mapper
    config:
      syncMode: FORCE
      role: admin

# Auth flow with SAML + Password options
# Structure: cookie check -> forms subflow (username/password form with IDP button)
authenticationFlows:
  - alias: Browser with SAML and Password
    description: Browser authentication with SAML SSO and password option
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-cookie
        authenticatorFlow: false
        requirement: ALTERNATIVE
        priority: 10
        autheticatorFlow: false
        userSetupAllowed: false
      - authenticatorFlow: true
        requirement: ALTERNATIVE
        priority: 20
        autheticatorFlow: true
        flowAlias: SAML and Password Forms
        userSetupAllowed: false

  - alias: SAML and Password Forms
    description: Username/password form with SAML SSO option
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      # Username/password form - shows login form with IDP buttons
      - authenticator: auth-username-password-form
        authenticatorFlow: false
        requirement: REQUIRED
        priority: 10
        autheticatorFlow: false
        userSetupAllowed: false

# Local admin user for password login
users:
  - username: $(env:MASTER_ADMIN_USERNAME:-admin)
    email: $(env:MASTER_ADMIN_EMAIL)
    emailVerified: true
    enabled: true
    credentials:
      - type: password
        value: $(env:MASTER_ADMIN_PASSWORD)
        temporary: false
    realmRoles:
      - admin
