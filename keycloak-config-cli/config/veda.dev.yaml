---
# Dev environment overrides for veda realm
# Uses GitHub OAuth for authentication
enabled: true
realm: veda

identityProviders:
  # GitHub
  - alias: github # NOTE: this alias appears in the redirect_uri for the auth flow, update Github OAuth settings accordingly
    displayName: GitHub
    providerId: github
    enabled: true
    postBrokerLoginFlowAlias: "Email Whitelist Check"
    updateProfileFirstLoginMode: on
    trustEmail: false
    storeToken: false
    addReadTokenRoleOnCreate: false
    authenticateByDefault: false
    linkOnly: false
    config:
      syncMode: "IMPORT"
      clientId: $(env:VEDA_GH_CLIENT_ID)
      clientSecret: $(env:VEDA_GH_CLIENT_SECRET)
      defaultScope: openid read:org user:email
      organization: ieee-grss-veda
      team: $(env:GH_ADMIN_TEAM:-"jyaasa")
      caseSensitiveOriginalUsername: "false"

identityProviderMappers:
  - name: "email"
    identityProviderAlias: github
    identityProviderMapper: github-user-attribute-mapper
    config:
      syncMode: "IMPORT"
      jsonField: "email"
      userAttribute: "email"
  - name: "username"
    identityProviderAlias: github
    identityProviderMapper: github-user-attribute-mapper
    config:
      syncMode: "IMPORT"
      jsonField: "login"
      userAttribute: "username"
  - name: "name"
    identityProviderAlias: github
    identityProviderMapper: github-user-attribute-mapper
    config:
      syncMode: "IMPORT"
      jsonField: "name"
      userAttribute: "name"
  - name: "account-view-profile"
    identityProviderAlias: github
    identityProviderMapper: oidc-hardcoded-role-idp-mapper
    config:
      syncMode: "FORCE"
      role: "account.view-profile"
  - name: "account-manage-account"
    identityProviderAlias: github
    identityProviderMapper: oidc-hardcoded-role-idp-mapper
    config:
      syncMode: "FORCE"
      role: "account.manage-account"
  - name: "jupyterhub-default-user-group"
    identityProviderAlias: github
    identityProviderMapper: oidc-advanced-group-idp-mapper
    config:
      syncMode: "FORCE"
      group: $(env:JUPYTERHUB_DEFAULT_GROUP:-JupyterHub Basic User)

# Login Flow Configuration - auto-redirect to GitHub
browserFlow: Browser without Password
authenticationFlows:
  # Post-broker login flow for email whitelist checking
  # Whitelist is managed via Admin Console: Authentication -> Flows -> gear icon
  - alias: "Email Whitelist Check"
    description: "Checks user email against configurable whitelist"
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: email-whitelist
        authenticatorFlow: false
        requirement: REQUIRED
        priority: 10
  - alias: Browser without Password
    description: browser based authentication without username password form
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-cookie
        authenticatorFlow: false
        requirement: ALTERNATIVE
        priority: 10
        autheticatorFlow: false
        userSetupAllowed: false
      - authenticator: auth-spnego
        authenticatorFlow: false
        requirement: DISABLED
        priority: 20
        autheticatorFlow: false
        userSetupAllowed: false
      - authenticatorFlow: true
        requirement: ALTERNATIVE
        priority: 30
        autheticatorFlow: true
        flowAlias: Browser without Password forms
        userSetupAllowed: false
  - alias: Browser without Password forms
    description: Username, password, otp and other auth forms.
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticatorConfig: github
        authenticator: identity-provider-redirector
        authenticatorFlow: false
        requirement: REQUIRED
        priority: 20
        autheticatorFlow: false
        userSetupAllowed: false
      - authenticatorFlow: true
        requirement: CONDITIONAL
        priority: 21
        autheticatorFlow: true
        flowAlias: Browser without Password Browser - Conditional OTP
        userSetupAllowed: false
  - alias: Browser without Password Browser - Conditional OTP
    description: Flow to determine if the OTP is required for the authentication
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-configured
        authenticatorFlow: false
        requirement: REQUIRED
        priority: 10
        autheticatorFlow: false
        userSetupAllowed: false
      - authenticator: auth-otp-form
        authenticatorFlow: false
        requirement: REQUIRED
        priority: 20
        autheticatorFlow: false
        userSetupAllowed: false
authenticatorConfig:
  - alias: github
    config:
      defaultProvider: github
