---
# Dev environment overrides for veda realm
# Uses GitHub OAuth for authentication
enabled: true
realm: veda

identityProviders:
  # GitHub
  - alias: github # NOTE: this alias appears in the redirect_uri for the auth flow, update Github OAuth settings accordingly
    displayName: GitHub
    providerId: github
    enabled: true
    postBrokerLoginFlowAlias: "Email Whitelist Check"
    updateProfileFirstLoginMode: on
    trustEmail: false
    storeToken: false
    addReadTokenRoleOnCreate: false
    authenticateByDefault: false
    linkOnly: false
    config:
      syncMode: "IMPORT"
      clientId: $(env:VEDA_GH_CLIENT_ID)
      clientSecret: $(env:VEDA_GH_CLIENT_SECRET)
      defaultScope: openid read:org user:email
      organization: ieee-grss-veda
      team: $(env:GH_ADMIN_TEAM:-"jyaasa")
      caseSensitiveOriginalUsername: "false"

identityProviderMappers:
  - name: "email"
    identityProviderAlias: github
    identityProviderMapper: github-user-attribute-mapper
    config:
      syncMode: "IMPORT"
      jsonField: "email"
      userAttribute: "email"
  - name: "username"
    identityProviderAlias: github
    identityProviderMapper: github-user-attribute-mapper
    config:
      syncMode: "IMPORT"
      jsonField: "login"
      userAttribute: "username"
  - name: "name"
    identityProviderAlias: github
    identityProviderMapper: github-user-attribute-mapper
    config:
      syncMode: "IMPORT"
      jsonField: "name"
      userAttribute: "name"
  - name: "account-view-profile"
    identityProviderAlias: github
    identityProviderMapper: oidc-hardcoded-role-idp-mapper
    config:
      syncMode: "FORCE"
      role: "account.view-profile"
  - name: "account-manage-account"
    identityProviderAlias: github
    identityProviderMapper: oidc-hardcoded-role-idp-mapper
    config:
      syncMode: "FORCE"
      role: "account.manage-account"
  - name: "jupyterhub-default-user-group"
    identityProviderAlias: github
    identityProviderMapper: oidc-advanced-group-idp-mapper
    config:
      syncMode: "FORCE"
      group: $(env:JUPYTERHUB_DEFAULT_GROUP:-JupyterHub Basic User)

# Login Flow Configuration - show choice between GitHub SSO and Guest login
# Flow definitions are in veda.yaml; this just activates the browser choice flow
browserFlow: Browser with Choice
authenticationFlows:
  # Post-broker login flow for email whitelist checking
  # Whitelist is managed via 'ssoEmailWhitelist' realm attribute (Admin REST API)
  - alias: "Email Whitelist Check"
    description: "Checks user email against 'ssoEmailWhitelist' realm attribute"
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: email-whitelist
        authenticatorFlow: false
        requirement: REQUIRED
        priority: 10
